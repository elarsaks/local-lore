services:
  locallore:
    image: ${LOCALLORE_IMAGE:-locallore:0.3.0}
    build:
      context: ${LOCALLORE_PLUGIN_ROOT:-.}
    container_name: locallore
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    init: true
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${CLAUDE_PROJECTS_DIR}
        target: /sessions
        read_only: true
      - type: volume
        source: locallore-data
        target: /data
    tmpfs:
      - /tmp:size=256m,uid=65532,gid=65532,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:8765:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s
    command: ["serve"]

volumes:
  locallore-data:
