name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python and plugin quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run repository quality checks
        run: ./scripts/check.sh

      - name: Validate plugin manifest
        run: |
          uv run --locked python -m json.tool .claude-plugin/plugin.json >/dev/null
          uv run --locked python -c '
          import json
          from pathlib import Path
          from locallore import __version__
          manifest = json.loads(Path(".claude-plugin/plugin.json").read_text())
          assert manifest["name"] == "locallore"
          assert manifest["version"] == __version__
          assert manifest["author"]["name"] == "Elar Saks"
          '

      - name: Validate Compose configuration
        env:
          CLAUDE_PROJECTS_DIR: /tmp
          LOCALLORE_TOKEN: ci-only-placeholder-token-not-used-at-runtime
        run: docker compose config --quiet

  offline-image:
    name: Offline image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build offline runtime image
        run: docker build --tag locallore-ci .
      - name: Embed fixtures without runtime networking
        run: |
          docker volume create locallore-ci-data
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=256m,uid=65532,gid=65532 \
            --mount type=bind,source="$GITHUB_WORKSPACE/evals/fixtures/keyword-sessions",target=/sessions,readonly \
            --mount type=volume,source=locallore-ci-data,target=/data \
            locallore-ci index
      - name: Verify semantic paraphrase retrieval offline
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=256m,uid=65532,gid=65532 \
            --mount type=volume,source=locallore-ci-data,target=/data \
            --entrypoint /app/.venv/bin/python locallore-ci -c '
          from pathlib import Path
          from locallore.storage.db import connect
          from locallore.embeddings import FastEmbedder
          from locallore.search import search_messages
          connection = connect(Path("/data/locallore.db"))
          embedder = FastEmbedder("BAAI/bge-small-en-v1.5", Path("/models"), 384)
          results = search_messages(connection, "Why eliminate the web API?", embedder=embedder)["results"]
          assert results[0]["message_id"] == "alpha-question", results
          '
